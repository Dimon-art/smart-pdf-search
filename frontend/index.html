<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Умный поиск на страницах</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 440px;
      padding: 15px;
      overflow-y: auto;
      border-right: 1px solid #e0e0e0;
      background: #fafafa;
    }
    #viewer {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #525659;
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 10px 0; }
    .pdf-name {
      font-size: 12px;
      color: #888;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .upload-block {
      margin-bottom: 15px;
      padding: 10px;
      background: #eef5ff;
      border-radius: 4px;
      border: 1px dashed #4a90e2;
    }
    .upload-block label {
      display: block;
      font-size: 13px;
      color: #4a90e2;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .upload-block input[type="file"] {
      display: block;
      font-size: 12px;
      width: 100%;
    }
    #uploadStatus {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      min-height: 15px;
    }
    .progress-bar {
      display: none;
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar.visible { display: block; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a90e2, #6fa8dc);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }
    .query-block { display: flex; gap: 8px; margin-bottom: 15px; }
    #query {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #searchBtn {
      padding: 8px 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #searchBtn:hover { background: #3a7bc8; }
    #searchBtn:disabled { background: #aaa; cursor: wait; }
    #status { color: #666; margin-bottom: 10px; font-size: 14px; }
    .result {
      border-left: 3px solid #4a90e2;
      padding: 10px;
      margin-bottom: 10px;
      background: white;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .result:hover { background: #f0f7ff; }
    .result.active { background: #e6f0fb; border-left-color: #ff6b35; }
    .result-header {
      font-weight: bold;
      color: #4a90e2;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .score { color: #999; font-size: 13px; font-weight: normal; }
    .pages { color: #666; font-size: 12px; margin-bottom: 5px; }
    .result-chunk {
      color: #333;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .result-actions {
      display: flex;
      gap: 8px;
    }
    .btn-small {
      padding: 5px 12px;
      font-size: 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: #f0f0f0;
      color: #333;
    }
    .btn-small:hover { background: #e0e0e0; }
    .btn-small.primary {
      background: #ff8c42;
      color: white;
    }
    .btn-small.primary:hover { background: #e67a30; }
    .page-wrapper {
      position: relative;
      display: inline-block;
      margin: 10px auto;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .page-wrapper canvas { display: block; }
    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .highlight {
      position: absolute;
      background: rgba(255, 215, 0, 0.35);
      border: 1px solid rgba(255, 140, 0, 0.7);
      border-radius: 2px;
    }
    .page-number {
      position: absolute;
      top: -22px;
      right: 0;
      font-size: 12px;
      color: #ccc;
    }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: white;
      border-radius: 6px;
      padding: 20px;
      width: 640px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
    }
    .modal-field {
      margin-bottom: 12px;
    }
    .modal-field label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .modal-field input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .matches-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin-top: 10px;
    }
    .match-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
    }
    .match-item:last-child { border-bottom: none; }
    .match-item input[type="checkbox"] {
      margin-top: 3px;
      flex-shrink: 0;
    }
    .match-item label {
      cursor: pointer;
      flex: 1;
      line-height: 1.4;
    }
    .match-meta {
      color: #888;
      font-size: 12px;
      margin-right: 6px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background: #4a90e2;
      color: white;
    }
    .btn-primary:hover { background: #3a7bc8; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover { background: #e0e0e0; }
    .modal-status {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
    .success-banner {
      display: none;
      background: #e8f5e9;
      border: 1px solid #66bb6a;
      color: #2e7d32;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 13px;
    }
    .success-banner.visible { display: block; }
    .success-banner a {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Умный поиск на страницах</h1>
    <div class="pdf-name" id="pdfName">загрузка...</div>

    <div class="upload-block">
      <label for="pdfFile">Загрузить свой PDF</label>
      <input id="pdfFile" type="file" accept="application/pdf">
      <div id="uploadStatus"></div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="query-block">
      <input id="query" type="search" placeholder="Введите запрос..." autofocus>
      <button id="searchBtn">Искать</button>
    </div>
    <div id="status"></div>
    <div id="results"></div>
  </div>
  <div id="viewer"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Замена текста</h2>

      <div class="modal-field">
        <label>Искать (в PDF):</label>
        <input id="modalOldText" type="text" readonly>
      </div>

      <div class="modal-field">
        <label>Заменить на:</label>
        <input id="modalNewText" type="text" placeholder="Введите новый текст...">
      </div>

      <div class="modal-field">
        <label>Найденные совпадения (<span id="matchCount">0</span>):</label>
        <div class="matches-list" id="matchesList"></div>
      </div>

      <div class="modal-status" id="modalStatus"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancel">Отмена</button>
        <button class="btn btn-primary" id="modalReplace" disabled>Заменить выбранные</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

    const STAGE_LABELS = {
      uploading: "Загрузка файла",
      parsing: "Разбор PDF",
      chunking: "Разбивка на чанки",
      embedding: "Генерация эмбеддингов",
      saving: "Сохранение индекса",
      loading_cache: "Загрузка из кэша",
      ready: "Готово",
      error: "Ошибка",
      idle: "Ожидание",
    };

    const queryInput = document.getElementById("query");
    const searchBtn = document.getElementById("searchBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const viewerEl = document.getElementById("viewer");
    const pdfNameEl = document.getElementById("pdfName");
    const pdfFileInput = document.getElementById("pdfFile");
    const uploadStatusEl = document.getElementById("uploadStatus");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");

    const modalOverlay = document.getElementById("modalOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalOldText = document.getElementById("modalOldText");
    const modalNewText = document.getElementById("modalNewText");
    const matchesList = document.getElementById("matchesList");
    const matchCount = document.getElementById("matchCount");
    const modalStatus = document.getElementById("modalStatus");
    const modalCancel = document.getElementById("modalCancel");
    const modalReplace = document.getElementById("modalReplace");

    let pdfDoc = null;
    let pageWrappers = {};
    let highlightLayers = {};
    let pollTimer = null;
    let currentOldText = "";

    async function fetchStatus() {
      const r = await fetch("/status");
      return await r.json();
    }

    async function updatePdfName() {
      try {
        const data = await fetchStatus();
        pdfNameEl.textContent =
          (data.pdf_name || "PDF") + " · чанков: " + (data.chunks_count || 0);
      } catch (err) {
        pdfNameEl.textContent = "PDF";
      }
    }

    async function loadPdf() {
      try {
        viewerEl.innerHTML = "";
        pageWrappers = {};
        highlightLayers = {};

        const cacheBuster = "?t=" + Date.now();
        pdfDoc = await pdfjsLib.getDocument("/static/current.pdf" + cacheBuster).promise;
        for (let num = 1; num <= pdfDoc.numPages; num++) {
          await renderPage(num);
        }
        console.log("PDF загружен:", pdfDoc.numPages, "страниц");
      } catch (err) {
        console.error("Ошибка загрузки PDF:", err);
        statusEl.textContent = "Не удалось загрузить PDF: " + err.message;
      }
    }

    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 0.7 });

      const wrapper = document.createElement("div");
      wrapper.className = "page-wrapper";
      wrapper.style.width = viewport.width + "px";
      wrapper.style.height = viewport.height + "px";
      wrapper.id = "page-" + num;

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;

      const highlightLayer = document.createElement("div");
      highlightLayer.className = "highlight-layer";
      highlightLayer.style.width = viewport.width + "px";
      highlightLayer.style.height = viewport.height + "px";

      const pageNumber = document.createElement("div");
      pageNumber.className = "page-number";
      pageNumber.textContent = "Стр. " + num;

      wrapper.appendChild(canvas);
      wrapper.appendChild(highlightLayer);
      wrapper.appendChild(pageNumber);
      viewerEl.appendChild(wrapper);

      pageWrappers[num] = wrapper;
      highlightLayers[num] = { el: highlightLayer, pdfPage: page };
    }

    function clearHighlights() {
      for (const num in highlightLayers) {
        highlightLayers[num].el.innerHTML = "";
      }
    }

    function highlightResult(result) {
      clearHighlights();
      if (!result.bboxes || !result.bboxes.length) return;

      const byPage = {};
      for (const b of result.bboxes) {
        if (!byPage[b.page]) byPage[b.page] = [];
        byPage[b.page].push(b.bbox);
      }

      let firstPage = null;
      for (const pageNumStr in byPage) {
        const pageNum = parseInt(pageNumStr, 10);
        const layer = highlightLayers[pageNum];
        if (!layer) continue;

        const viewport = layer.pdfPage.getViewport({ scale: 0.7 });

        for (const bbox of byPage[pageNumStr]) {
          const [x0, y0, x1, y1] = bbox;
          const [cx0, cy0] = viewport.convertToViewportPoint(x0, y0);
          const [cx1, cy1] = viewport.convertToViewportPoint(x1, y1);

          const left = Math.min(cx0, cx1);
          const top = Math.min(cy0, cy1);
          const width = Math.abs(cx1 - cx0);
          const height = Math.abs(cy1 - cy0);

          const div = document.createElement("div");
          div.className = "highlight";
          div.style.left = left + "px";
          div.style.top = top + "px";
          div.style.width = width + "px";
          div.style.height = height + "px";
          layer.el.appendChild(div);
        }

        if (firstPage === null || pageNum < firstPage) firstPage = pageNum;
      }

      if (firstPage !== null) {
        const target = pageWrappers[firstPage];
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    async function doSearch() {
      const query = queryInput.value.trim();
      if (!query) {
        statusEl.textContent = "Введите запрос";
        return;
      }

      resultsEl.innerHTML = "";
      clearHighlights();
      statusEl.textContent = "Поиск...";
      searchBtn.disabled = true;

      try {
        const response = await fetch("/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, top_k: 5 }),
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const results = data.results || [];

        if (!results.length) {
          statusEl.textContent = "Ничего не найдено";
          return;
        }

        statusEl.textContent = "Найдено: " + results.length;

        results.forEach((item, i) => {
          const card = document.createElement("div");
          card.className = "result";
          card.dataset.index = i;

          const header = document.createElement("div");
          header.className = "result-header";
          const rankSpan = document.createElement("span");
          rankSpan.textContent = "#" + item.rank;
          const scoreSpan = document.createElement("span");
          scoreSpan.className = "score";
          scoreSpan.title = "Меньше = ближе по смыслу";
          scoreSpan.textContent = "score: " + Number(item.score).toFixed(2);
          header.appendChild(rankSpan);
          header.appendChild(scoreSpan);

          const pages = document.createElement("div");
          pages.className = "pages";
          pages.textContent = "Страницы: " + (item.pages || []).join(", ");

          const chunk = document.createElement("div");
          chunk.className = "result-chunk";
          const text = item.chunk || "";
          chunk.textContent = text.length > 300 ? text.slice(0, 300) + "..." : text;

          const actions = document.createElement("div");
          actions.className = "result-actions";
          const replaceBtn = document.createElement("button");
          replaceBtn.className = "btn-small primary";
          replaceBtn.textContent = "Найти и заменить";
          replaceBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openReplaceModal();
          });
          actions.appendChild(replaceBtn);

          card.appendChild(header);
          card.appendChild(pages);
          card.appendChild(chunk);
          card.appendChild(actions);

          card.addEventListener("click", () => {
            document.querySelectorAll(".result").forEach((c) => c.classList.remove("active"));
            card.classList.add("active");
            highlightResult(item);
          });

          resultsEl.appendChild(card);
        });

        document.querySelector(".result").click();
      } catch (err) {
        statusEl.textContent = "Ошибка: " + err.message;
      } finally {
        searchBtn.disabled = false;
      }
    }

    function setProgress(stage, progress) {
      const label = STAGE_LABELS[stage] || stage;
      if (stage === "ready") {
        uploadStatusEl.textContent = label;
        progressFill.style.width = "100%";
        setTimeout(() => progressBar.classList.remove("visible"), 1000);
      } else if (stage === "error") {
        uploadStatusEl.textContent = "Ошибка: " + label;
        progressBar.classList.remove("visible");
      } else {
        uploadStatusEl.textContent = label + " (" + progress + "%)";
        progressBar.classList.add("visible");
        progressFill.style.width = progress + "%";
      }
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function pollStatus() {
      try {
        const data = await fetchStatus();
        setProgress(data.stage, data.progress);

        if (!data.running && data.stage === "ready") {
          stopPolling();
          await updatePdfName();
          await loadPdf();
          resultsEl.innerHTML = "";
          statusEl.textContent = "PDF обновлён. Введите запрос.";
        } else if (data.stage === "error") {
          stopPolling();
          uploadStatusEl.textContent = "Ошибка: " + (data.error || "неизвестная");
        }
      } catch (err) {
        console.error("Poll error:", err);
      }
    }

    async function handleUpload() {
      const file = pdfFileInput.files[0];
      if (!file) return;

      if (!file.name.toLowerCase().endsWith(".pdf")) {
        uploadStatusEl.textContent = "Только PDF-файлы";
        return;
      }

      uploadStatusEl.textContent =
        "Загрузка: " + file.name + " (" + (file.size / 1024 / 1024).toFixed(1) + " МБ)...";
      progressBar.classList.add("visible");
      progressFill.style.width = "0%";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "HTTP " + response.status);
        }

        stopPolling();
        pollTimer = setInterval(pollStatus, 2000);
        pollStatus();
      } catch (err) {
        uploadStatusEl.textContent = "Ошибка: " + err.message;
        progressBar.classList.remove("visible");
      } finally {
        pdfFileInput.value = "";
      }
    }

    /* ---------- Replace modal ---------- */

    async function openReplaceModal() {
      const query = queryInput.value.trim();
      if (!query) {
        statusEl.textContent = "Сначала введите запрос";
        return;
      }

      currentOldText = query;
      modalOldText.value = query;
      modalNewText.value = "";
      matchesList.innerHTML = "";
      matchCount.textContent = "0";
      modalStatus.textContent = "Поиск совпадений...";
      modalReplace.disabled = true;
      modalOverlay.classList.add("visible");

      try {
        const response = await fetch("/find_matches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_text: query }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "HTTP " + response.status);
        }

        const data = await response.json();
        const matches = data.matches || [];
        matchCount.textContent = String(matches.length);

        if (!matches.length) {
          modalStatus.textContent = "Совпадений не найдено";
          return;
        }

        modalStatus.textContent = "";

        matches.forEach((m) => {
          const row = document.createElement("div");
          row.className = "match-item";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = true;
          cb.dataset.id = String(m.id);

          const lbl = document.createElement("label");
          const meta = document.createElement("span");
          meta.className = "match-meta";
          meta.textContent = "Стр. " + (m.page + 1) + " · ";
          lbl.appendChild(meta);
          lbl.appendChild(document.createTextNode(m.context || "(без контекста)"));
          lbl.prepend(cb);

          cb.addEventListener("change", updateReplaceBtnState);

          row.appendChild(lbl);
          matchesList.appendChild(row);
        });

        updateReplaceBtnState();
        modalNewText.focus();
      } catch (err) {
        modalStatus.textContent = "Ошибка: " + err.message;
      }
    }

    function updateReplaceBtnState() {
      const anyChecked = matchesList.querySelector("input[type=checkbox]:checked") !== null;
      const hasNew = modalNewText.value.trim().length > 0;
      modalReplace.disabled = !(anyChecked && hasNew);
    }

    function closeModal() {
      modalOverlay.classList.remove("visible");
      modalStatus.textContent = "";
      matchesList.innerHTML = "";
    }

    async function doReplace() {
      const newText = modalNewText.value.trim();
      if (!newText) {
        modalStatus.textContent = "Введите текст для замены";
        return;
      }

      const selected = Array.from(
        matchesList.querySelectorAll("input[type=checkbox]:checked")
      ).map((cb) => parseInt(cb.dataset.id, 10));

      if (!selected.length) {
        modalStatus.textContent = "Не выбрано ни одного совпадения";
        return;
      }

      modalReplace.disabled = true;
      modalStatus.textContent = "Замена...";

      try {
        const response = await fetch("/replace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            old_text: currentOldText,
            new_text: newText,
            selected_ids: selected,
          }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "HTTP " + response.status);
        }

        const data = await response.json();
        const dlUrl = data.download_url + "?t=" + Date.now();

        let msg = "Заменено: " + data.replaced_count;
        if (data.skipped_count > 0) {
          msg += ", пропущено: " + data.skipped_count + " (не помещается)";
        }

        modalStatus.innerHTML =
          msg + ' · <a href="' + dlUrl + '" download>Скачать PDF</a>';
      } catch (err) {
        modalStatus.textContent = "Ошибка: " + err.message;
        modalReplace.disabled = false;
      }
    }

    modalCancel.addEventListener("click", closeModal);
    modalReplace.addEventListener("click", doReplace);
    modalNewText.addEventListener("input", updateReplaceBtnState);
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    searchBtn.addEventListener("click", doSearch);
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });
    pdfFileInput.addEventListener("change", handleUpload);

    updatePdfName();
    loadPdf();
  </script>
</body>
</html>
