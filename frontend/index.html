<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart PDF Search</title>
</head>
<body>
  <h1>Smart PDF Search</h1>

  <form>
    <label for="pdf">Загрузить PDF</label>
    <input id="pdf" type="file" accept="application/pdf">
  </form>

  <form>
    <label for="query">Поиск</label>
    <input id="query" type="search" placeholder="Введите запрос">
    <button type="submit">Искать</button>
  </form>
</body>
</html>
